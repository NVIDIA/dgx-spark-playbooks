{
  "server": {
    "host": "127.0.0.1",
    "port": 1933,
    "auth_mode": "dev"
  },
  "storage": {
    "workspace": "~/.openviking/data",
    "vectordb": {
      "backend": "local",
      "distance_metric": "cosine",
      "cuvs": {
        "auto_enable": true,
        "algorithm": "brute_force",
        "dtype": "float32",
        "fallback_to_native": true,
        "max_concurrent_gpu_searches": 1,
        "micro_batching_enabled": false,
        "filter_cache_size": 16,
        "auto_memory_reserve_mb": 8192,
        "auto_memory_safety_factor": 2.0,
        "auto_filter_native_threshold": 2000,
        "auto_path_filter_native_threshold": 200,
        "auto_background_rebuild": true,
        "auto_rebuild_debounce_ms": 500
      }
    }
  },
  "embedding": {
    "dense": {
      "provider": "ollama",
      "model": "qwen3-embedding:0.6b",
      "api_base": "http://127.0.0.1:11434/v1",
      "dimension": 1024,
      "batch_size": 8,
      "input": "text"
    }
  },
  "vlm": {
    "provider": "litellm",
    "model": "ollama/qwen3.8:27b",
    "api_key": "no-key",
    "api_base": "http://127.0.0.1:11434",
    "temperature": 0.0,
    "max_retries": 2,
    "max_concurrent": 1,
    "timeout": 600,
    "extra_request_body": {
      "num_ctx": 16384,
      "think": false
    }
  },
  "telemetry": {
    "tracer": {
      "enabled": false
    }
  }
}
